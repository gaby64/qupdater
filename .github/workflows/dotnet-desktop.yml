name: Windows build
on:
  push:
    branches: [main, security-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows x64
        run: dotnet publish QUpdater.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Release filename smoke test
        shell: pwsh
        run: |
          $test = Start-Process -FilePath (Resolve-Path publish/qUpdater.exe).Path -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Self-test failed: $($test.ExitCode)" }
      - name: Assemble artifact
        shell: pwsh
        run: |
          Copy-Item install.bat,uninstall.bat,README.md -Destination publish
          Get-FileHash publish/qUpdater.exe -Algorithm SHA256 | Format-List | Out-File publish/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qUpdater-win-x64
          path: publish/
